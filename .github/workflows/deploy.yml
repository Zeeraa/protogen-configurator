name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build -- --base-href /protogen-configurator/

      # GitHub Pages serves 404.html for unknown paths, letting the SPA router handle deep links
      - run: cp dist/protogen-configurator/browser/index.html dist/protogen-configurator/browser/404.html

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/protogen-configurator/browser
